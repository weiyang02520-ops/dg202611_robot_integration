vision_perception_node:
  ros__parameters:
    # ROS node default remains skeleton-only (no camera / inference).
    # V1 offline file detection uses: ros2 run vision_perception vision_offline_detect
    # Unsupported ROS modes are rejected at startup. Parameters are startup-only.
    mode: skeleton
    detector_enabled: false
    tracking_enabled: false
    publish_debug_image: false
    backend: unconfigured
    model_path: ""
    model_manifest_path: ""

    # Reserved interface names. Local ZED names are source-supported, not hardware-verified.
    rgb_topic: /zed/zed_node/rgb/color/rect/image
    depth_topic: /zed/zed_node/depth/depth_registered
    camera_info_topic: /zed/zed_node/rgb/color/rect/camera_info
    detections_topic: /dg/vision/detections_2d
    objects_topic: /dg/vision/objects
    status_topic: /dg/vision/status
    target_classes: [bottle, cup]

    # V4 plan defaults for future V1-C / V2; skeleton does not enforce depth/sync.
    output_frame_policy: input_optical_header
    sync_tolerance_sec: 0.010
    min_depth_m: 0.5
    max_depth_m: 1.5
    inference_rate_hz: 5.0
    confidence_threshold: 0.35
    nms_iou_threshold: 0.45
    max_detections: 20
    ort_threads: 2
    model_input_size: 640
    status_rate_hz: 1.0
